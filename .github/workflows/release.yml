name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Linux fejlécek / Linux headers
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev zip
      - name: Tesztek / Tests
        run: GOSUMDB=off GOFLAGS=-mod=mod go test ./...
      - name: Verziószám ellenőrzése / Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' version.go)
          [ "${GITHUB_REF_NAME#v}" = "$VER" ] || { echo "A címke ($GITHUB_REF_NAME) és a version.go ($VER) eltér"; exit 1; }
      - name: Csomagolás / Package
        run: |
          mkdir -p dist && sh ./package.sh "$PWD/dist"
          cd dist && sha256sum GozieCmd-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Kiadási jegyzet / Release notes
        run: |
          VER=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' version.go)
          echo "VER=$VER" >> "$GITHUB_ENV"
          awk -v v="## $VER" '$0==v{on=1;next} /^## /{on=0} on' VALTOZASOK.md > notes.md
          [ -s notes.md ] || echo "Gozie Commander $VER" > notes.md
          printf '\n**Letöltés / Download:** Windows: `GozieCmd-%s-windows.zip`, Linux: `GozieCmd-%s-linux-x86_64.tar.gz` vagy Flatpak / or Flatpak: `GozieCmd-%s-x86_64.flatpak`\n' "$VER" "$VER" "$VER" >> notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: GozieCmd
          path: dist/*
      - name: Kiadás / Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Gozie Commander ${{ env.VER }}
          body_path: notes.md
          files: dist/*

  # Flatpak: aláírt tároló a GitHub Pages-en (https://gozie-lab.github.io/GozieCmd/), és egy
  # .flatpak fájl a kiadáshoz, amely telepítéskor ezt a tárolót is hozzáadja (így frissül).
  # Kell hozzá a FLATPAK_GPG_KEY titok (a tároló aláíró kulcsa).
  # Ha ez a lépés nem sikerül, a többi letöltés attól még kikerül.
  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      REPO_URL: https://gozie-lab.github.io/GozieCmd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false
      - name: Go-modulok a csomagba / Vendor Go modules
        run: GOSUMDB=off GOFLAGS=-mod=mod go mod vendor
      - name: Verzió a leírásba / Version into metainfo
        run: |
          VER=$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' version.go)
          echo "VER=$VER" >> "$GITHUB_ENV"
          F=flatpak/hu.gozie.commander.metainfo.xml
          grep -q "release version=\"$VER\"" $F || sed -i "s#<releases>#<releases>\n    <release version=\"$VER\" date=\"$(date +%F)\"/>#" $F
      - name: Aláíró kulcs / Signing key
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          [ -n "$FLATPAK_GPG_KEY" ] || { echo "Hiányzik a FLATPAK_GPG_KEY titok (Settings › Secrets and variables › Actions)"; exit 1; }
          mkdir -m 700 "$PWD/gpg"
          printf '%s\n' "$FLATPAK_GPG_KEY" | gpg --homedir "$PWD/gpg" --batch --import
          echo "GPG_ID=$(gpg --homedir "$PWD/gpg" --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Fordítás és tároló / Build and repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          mkdir -p site
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --default-branch=stable \
            --repo=site/repo --gpg-sign="$GPG_ID" --gpg-homedir="$PWD/gpg" --force-clean \
            build flatpak/hu.gozie.commander.yml
          flatpak build-update-repo --generate-static-deltas --prune --default-branch=stable \
            --title="Gozie Commander" --gpg-sign="$GPG_ID" --gpg-homedir="$PWD/gpg" site/repo
          flatpak build-bundle --repo-url="$REPO_URL/repo/" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            --gpg-keys=flatpak/gozie-flatpak.gpg --gpg-sign="$GPG_ID" --gpg-homedir="$PWD/gpg" \
            site/repo "GozieCmd-$VER-x86_64.flatpak" hu.gozie.commander stable
          sh flatpak/tarolo.sh site "$REPO_URL" "$VER"
          rm -rf "$PWD/gpg"
          ls -la site "GozieCmd-$VER-x86_64.flatpak"
      - name: Kiadás / Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GozieCmd-${{ env.VER }}-x86_64.flatpak
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # A Flatpak-tároló közzététele (GitHub Pages: Settings › Pages › Source: GitHub Actions).
  pages:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
